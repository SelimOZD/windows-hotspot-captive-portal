<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#142832" />
<meta http-equiv="refresh" content="0; url=__PORTAL_URL__" />
<title>Guest network access</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(circle at 85% 0%, rgba(245,211,106,.12), transparent 55%), #142832;
    color: #e6edf2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
  }
  .card {
    width: 100%; max-width: 360px;
    background: #1b3640; border: 1px solid #2b4d59; border-radius: 20px;
    padding: 30px 26px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
    background: #f5d36a; color: #142832; display: grid; place-items: center;
  }
  h1 { margin: 0 0 8px; font-size: 1.2rem; letter-spacing: -.02em; }
  p { margin: 0; font-size: .88rem; line-height: 1.6; color: #9fb3bd; }
  .bar { margin-top: 20px; height: 4px; border-radius: 999px; background: #2b4d59; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 40%; border-radius: 999px; background: #f5d36a; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar > span { animation: none; width: 100%; } }
  a.button {
    display: inline-block; margin-top: 22px; padding: 12px 22px; border-radius: 12px;
    background: #14707a; color: #ffffff; font-weight: 700; text-decoration: none;
  }
  noscript p { margin-top: 16px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
        <path d="M1.42 9a16 16 0 0 1 21.16 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>Guest network access</h1>
    <p>Taking you to the request form...</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <noscript><p>JavaScript is off. Use the button below.</p></noscript>
    <a class="button" href="__PORTAL_URL__">Open the request form</a>
  </main>
  <script>
    (function () {
      var target = "__PORTAL_URL__";
      try { window.location.replace(target); } catch (e) {}
      setTimeout(function () {
        if (window.location.href.indexOf(target) === -1) { window.location.href = target; }
      }, 1200);
    })();
  </script>
</body>
</html>
